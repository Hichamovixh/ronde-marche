name: Collecte et publication

on:
  schedule:
    # Heures en UTC, plusieurs fois par jour.
    - cron: "17 6,12,18,22 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    outputs:
      collecte: ${{ steps.collecte.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Lancer les tests
        run: python3 -m unittest discover -s tests
      - name: Collecter les données
        id: collecte
        continue-on-error: true
        run: python3 scripts/collecte.py
      - name: Enregistrer les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Mise à jour des données de marché"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
      - name: Signaler une collecte en échec
        if: needs.construire.outputs.collecte == 'failure'
        run: |
          echo "Aucune source de données n'a répondu." >&2
          exit 1
